version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # One PR for all minor/patch bumps; majors stay individual so each gets
    # its own migration assessment (the Express 5 / Zod 4 rule).
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors held back deliberately — land only with an explicit migration
      # ticket (see the Express 5 / Zod 4 assessment in PR history).
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
